<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SPA shell for EVERY route (public/_redirects sends /* to index.html).
         Never add a canonical link or a meta description here: both used to
         live in this file and both broke every URL on the site. Per-page head
         tags belong in src/components/SEO.tsx — see the note at its top.
         (Tag syntax deliberately not spelled out above; crawlers that scan
         raw HTML with regexes read example markup inside comments as real.) -->
    <!-- Keep this byte-identical to HOME_TITLE in src/pages/Index.tsx.
         This tag is what Googlebot's first pass and every social crawler read;
         Helmet swaps in the per-page title only after hydration. When the two
         disagreed, the homepage had one title pre-JS and a different one
         post-JS, and neither displayed reliably.

         Lovable's "Update site info for publish" panel rewrites this tag and
         has silently corrupted it before — commit ed663f7 shipped the brand as
         "Sacramento Assisted Living Directo". If a publish changes this line,
         restore it and re-check Index.tsx still matches. -->
    <title>Assisted Living in Sacramento | Sacramento Assisted Living Directory</title>
    <meta name="theme-color" content="#1f3a5f" />

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sacramento Assisted Living Directory" />
    <meta property="og:url" content="https://sacramentoelderlycare.com/" />
    
    
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/XevUA0vYDKQ7hDQnXKe4np9edHC3/social-images/social-1782693488540-og-image-assisted-living-directory.webp">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/XevUA0vYDKQ7hDQnXKe4np9edHC3/social-images/social-1782693488540-og-image-assisted-living-directory.webp">
    <meta property="og:title" content="Sacramento Assisted Living Directory — Assisted Living, Memory Care &amp; Board and Care Homes">
  <meta name="twitter:title" content="Sacramento Assisted Living Directory — Assisted Living, Memory Care &amp; Board and Care Homes">
  <meta property="og:description" content="Sacramento Assisted Living Directory helps families compare assisted living, memory care, and board and care homes — with free placement advisors guiding the way.">
  <meta name="twitter:description" content="Sacramento Assisted Living Directory helps families compare assisted living, memory care, and board and care homes — with free placement advisors guiding the way.">
</head>

  <body>
    <div id="root"></div>

    <!-- Static form mirror so Netlify Forms detects fields at build time. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="inquiry-for" />
      <input type="text" name="facility_of_interest" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
